<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JOINNOW.TV</title>
</head>
<body class="landing-page">

<div id="fisheyeStage" aria-hidden="false"></div>

<a href="dashboard.html" class="fixed-item glass-btn" id="enterSite">ENTER SITE →</a>

<script src="fisheye.js"></script>
<script>
    const HOME = 'dashboard.html';

    function openHome() {
        if (document.body.classList.contains('opening-home')) return;
        document.body.classList.add('opening-home');
        setTimeout(() => { window.location.href = HOME; }, 900);
    }

    document.getElementById('enterSite').addEventListener('click', (e) => {
        e.preventDefault();
        openHome();
    });

    startFisheye({ text: 'JOIN NOW TV' });
    // Marquee plays, then opens into home
    setTimeout(openHome, 5600);
</script>

</body>
</html>
