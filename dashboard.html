<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JOINNOW.TV — Home</title>
</head>
<body class="home-page">
    <div class="dashboard-wrapper">
        <header class="nav-bar beveled-box">
            <div class="nav-links">
                <span class="nav-mark">JOINNOW.TV</span>
            </div>
            <h1 class="logo">HOME</h1>
            <div class="nav-links">
                <button type="button" class="nav-btn" id="edit-rail-btn">Edit Images</button>
            </div>
        </header>

        <div class="home-layout">
            <aside class="image-rail beveled-box" id="image-rail" aria-label="Image rail"></aside>

            <main class="home-main">
                <section class="beveled-box video-player-themed">
                    <div class="cctv-header">
                        <div class="playback-icons">▶ || [ ]</div>
                        <div class="video-status">
                            NOW PLAYING:<br>
                            <span class="glitch-text" id="video-title">Episode 8 - SEM</span>
                        </div>
                    </div>

                    <div class="monitor-screen">
                        <div class="iframe-container">
                            <iframe
                                src="https://www.youtube.com/embed/7E7cN5-5jbE"
                                title="YouTube video player"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                referrerpolicy="strict-origin-when-cross-origin"
                                allowfullscreen></iframe>
                        </div>
                        <div class="scanline"></div>
                    </div>

                    <div class="video-footer-nav">
                        <span class="desc-text" id="video-desc">Video description and whatnot</span>
                    </div>
                </section>

                <section class="beveled-box chat-room">
                    <div class="section-header">Chat Room</div>
                    <div class="comment-wall" id="chat-wall">
                        <p><span class="user-id">[SYSTEM]:</span> channel open. say something.</p>
                        <p><span class="user-id">[USER_88]:</span> site looks clean.</p>
                    </div>
                    <form class="chat-form" id="chat-form">
                        <input id="chat-input" type="text" maxlength="240" placeholder="type a message..." autocomplete="off">
                        <button type="submit">Send</button>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <div id="rail-editor" class="rail-editor" hidden aria-hidden="true">
        <form id="rail-editor-form" class="rail-editor-panel beveled-box">
            <h2>Edit left rail images</h2>
            <p class="rail-editor-help">Paste image URLs for the 5 slots. Saved in this browser.</p>
            <label>1 <input data-rail-input type="url" required placeholder="https://..."></label>
            <label>2 <input data-rail-input type="url" required placeholder="https://..."></label>
            <label>3 <input data-rail-input type="url" required placeholder="https://..."></label>
            <label>4 <input data-rail-input type="url" required placeholder="https://..."></label>
            <label>5 <input data-rail-input type="url" required placeholder="https://..."></label>
            <div class="rail-editor-actions">
                <button type="button" id="rail-editor-reset">Reset defaults</button>
                <button type="button" id="rail-editor-cancel">Cancel</button>
                <button type="submit">Save</button>
            </div>
        </form>
    </div>

    <script src="content.js"></script>
</body>
</html>
